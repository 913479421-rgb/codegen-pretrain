# Render 免费 PaaS 部署配置（把 GitHub 仓库后端一键跑在公网）
# 使用方式：在 render.com 用 GitHub 账号登录 → New + Blueprint → 选本仓库
# 平台会自动注入 PORT 环境变量，server.py 已适配读取
services:
  - type: web
    name: codegen-console
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: "python console/server.py --host 0.0.0.0"
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: 8080
